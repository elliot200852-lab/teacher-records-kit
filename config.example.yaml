# ════════════════════════════════════════════════════════════════
# Teacher Records Kit 設定範本
# 複製成 config.yaml 後填寫。config.yaml 已被 .gitignore 擋住，不會進 git。
# AI 設定時會逐項問你、幫你填。
# ════════════════════════════════════════════════════════════════

# 只有這個 Google 帳號能讀寫資料（伺服器端規則鎖定本人）
owner_email: "you@example.com"

# 學生代號前綴：所有紀錄一律用代號（如 S-01），不寫真名 → 去識別化
# 真名只存在本機名冊（roster），不上雲、不進 repo
id_prefix: "S"

firebase:
  project_id: "your-firebase-project-id"
  # 以下從 Firebase Console → 專案設定 → 你的網頁 App 取得（貼到 site/js/firebase-config.js）
  api_key: ""
  auth_domain: ""          # 通常是 <project_id>.firebaseapp.com
  storage_bucket: ""
  messaging_sender_id: ""
  app_id: ""

# ── 以下為「進階／選用」：本機檔案同步、寄家長信、每月提醒才需要 ──
# 只用網頁儀表板（核心功能）的話，可以不填。

records:
  # 每位學生一個資料夾：<students_dir>/<id>/observations.md（代號制、去識別化）
  students_dir: "./data/students"
  # 名冊（代號↔真名，PII）：CSV，第一欄代號編號、第二欄姓名
  roster_csv: "./data/roster.csv"

parents:
  # 家長通訊錄（PII）：CSV
  contacts_csv: "./data/contacts.csv"
  # 欄位位置（1-indexed）：哪一欄是座號/代號、哪兩欄是家長 email
  col_id: 1
  col_parent1_email: 2
  col_parent2_email: 3

email:
  method: "smtp"           # smtp（通用，建議）| gws（進階，需自行安裝 gws CLI）
  smtp_user: "you@gmail.com"
  # ⚠️ 不要把密碼寫在這！App Password 放環境變數 KIT_SMTP_APP_PASSWORD 或 .env（gitignored）
  # 申請：Google 帳號 → 安全性 → 兩步驟驗證 → 應用程式密碼
