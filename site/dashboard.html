<!doctype html>
<html lang="zh-Hant">
<head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>學生紀錄</title>
<style>
  :root { --brand: #2F7AC4; --ok: #2f7a3d; --todo: #c8483e; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, "Noto Sans TC", sans-serif; background: #fafafa; color: #222; margin: 0; }
  .shell { max-width: 920px; margin: 2rem auto; padding: 1rem 1.5rem; }
  h1 { font-weight: 700; }
  .auth, .meta { background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; }
  .auth { padding: 1.8rem; text-align: center; margin-top: 1rem; }
  .auth button { padding: .7rem 1.6rem; background: var(--brand); color: #fff; border: none; border-radius: 6px; cursor: pointer; font: inherit; font-size: 1rem; }
  .meta { display: flex; justify-content: space-between; align-items: center; padding: .8rem 1rem; margin: 1rem 0; flex-wrap: wrap; gap: .5rem; }
  .meta button { padding: .4rem .9rem; background: #fff; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; font: inherit; }
  .month-summary strong { color: var(--brand); }
  .student-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px,1fr)); gap: .7rem; margin-top: 1rem; }
  .student-card { text-align: left; padding: .8rem 1rem; background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; cursor: pointer; font: inherit; }
  .student-card:hover { border-color: var(--brand); box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .student-card.is-todo { border-color: #f3c5c5; }
  .sc-name { font-size: 1.05rem; font-weight: 600; }
  .sc-id { font-size: .8rem; color: #999; margin-left: .4rem; }
  .sc-meta { font-size: .8rem; color: #777; margin-top: .4rem; }
  .badge { display: inline-block; margin-top: .5rem; padding: .15rem .6rem; border-radius: 999px; font-size: .78rem; font-weight: 600; }
  .badge.done { background: #e6f3e8; color: var(--ok); }
  .badge.todo { background: #fdeaea; color: var(--todo); }
  .filter-row { margin-top: 1rem; font-size: .9rem; color: #555; }
  .detail-head { display: flex; align-items: baseline; gap: .8rem; margin: 1rem 0; flex-wrap: wrap; }
  .detail-head h2 { margin: 0; }
  .back-link { background: none; border: none; color: var(--brand); cursor: pointer; font: inherit; text-decoration: underline; padding: 0; }
  .add-btn { padding: .35rem .9rem; background: var(--ok); color: #fff; border: none; border-radius: 4px; cursor: pointer; font: inherit; font-size: .85rem; }
  .record-card { padding: 1rem 1.2rem; background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: .9rem; }
  .record-head { font-size: .9rem; color: #555; margin-bottom: .5rem; display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .rc-date { font-weight: 600; color: #333; }
  .record-tag { display: inline-block; margin-left: .4rem; padding: .1rem .5rem; background: #eef4fb; color: var(--brand); border-radius: 4px; font-size: .78rem; }
  .record-body { margin: 0; line-height: 1.7; white-space: pre-wrap; word-wrap: break-word; }
  .editor, #add-form { margin-top: .6rem; }
  #add-form { background: #fff; border: 1px solid var(--ok); border-radius: 8px; padding: .9rem; margin-bottom: 1rem; }
  .editor input, #add-form input, .editor textarea, #add-form textarea { width: 100%; padding: .45rem; border: 1px solid #ccc; border-radius: 4px; font: inherit; margin-bottom: .4rem; }
  .editor textarea, #add-form textarea { line-height: 1.6; resize: vertical; }
  .add-row { display: flex; gap: .5rem; flex-wrap: wrap; }
  .add-row input[type=date] { width: auto; }
  .add-row input.tags { flex: 1; min-width: 160px; }
  .editbtns { display: flex; gap: .5rem; align-items: center; }
  .editbtns button { padding: .35rem .9rem; border-radius: 4px; cursor: pointer; font: inherit; font-size: .85rem; }
  .save { background: var(--brand); color: #fff; border: none; }
  .cancel { background: #fff; color: #666; border: 1px solid #ccc; }
  .msg { font-size: .8rem; color: #888; }
  .flag em { color: #a0457f; font-size: .78rem; font-style: normal; }
  .empty-state { padding: 2rem; text-align: center; color: #888; }
  .rc-edit { padding: .25rem .7rem; background: #fff; border: 1px solid var(--brand); color: var(--brand); border-radius: 4px; cursor: pointer; font: inherit; font-size: .8rem; }
  .tag-chips { display: flex; flex-wrap: wrap; gap: .35rem; margin: 0 0 .5rem; }
  .tag-chips button { padding: .2rem .6rem; background: #eef4fb; color: var(--brand); border: 1px solid #d6e3f3; border-radius: 999px; cursor: pointer; font: inherit; font-size: .8rem; }
  .tag-chips button.on { background: var(--brand); color: #fff; border-color: var(--brand); }

  /* ── 分頁列（學生觀察／課程紀錄）── */
  .tab-bar { display: flex; gap: .3rem; margin-top: 1.2rem; border-bottom: 2px solid #e0e0e0; flex-wrap: wrap; }
  .tab-btn { padding: .5rem 1.1rem; background: none; border: none; cursor: pointer; font: inherit; font-size: 1rem; color: #666; border-bottom: 2px solid transparent; margin-bottom: -2px; }
  .tab-btn.active { color: #1f5c96; border-bottom-color: var(--brand); font-weight: 600; }

  /* ── 課程紀錄分頁 ── */
  .courses-toolbar { margin-top: 1rem; }
  .section-head { font-size: 1.05rem; font-weight: 700; color: #333; margin: 1.4rem 0 .2rem; }
  .season-head { font-size: .95rem; font-weight: 600; color: #555; margin: 1.1rem 0 .2rem; }
  .chip { display: inline-block; padding: .1rem .55rem; border-radius: 999px; font-size: .75rem; margin-right: .35rem; background: #f0f0f0; color: #666; }
  .course-card .cc-chips { margin-top: .45rem; }
  #new-course-form { background: #fff; border: 1px solid var(--ok); border-radius: 8px; padding: .9rem; margin: .6rem 0 1rem; }
  #new-course-form input, #new-course-form select { width: 100%; padding: .45rem; border: 1px solid #ccc; border-radius: 4px; font: inherit; margin-bottom: .4rem; background: #fff; }
  #new-course-form .nc-row { display: flex; gap: .5rem; flex-wrap: wrap; }
  #new-course-form .nc-row > * { flex: 1; min-width: 130px; }
  .nc-hint { font-size: .8rem; color: #888; margin: 0 0 .5rem; line-height: 1.6; }
</style>
</head>
<body>
<div class="shell">
  <h1>學生紀錄</h1>
  <p style="color:#666">只有擁有者本人能讀寫；資料受 Firestore 伺服器端規則保護。</p>

  <div id="auth" class="auth">
    <div id="auth-initial">
      <p>請以擁有者的 Google 帳號登入。</p>
      <button id="signin">Google 登入</button>
      <div id="auth-help" style="margin-top:1rem;font-size:.85rem;color:#777;line-height:1.7"></div>
    </div>
    <div id="auth-wrong" hidden>
      <p>此帳號 <strong id="wrong-email"></strong> 無權檢視。</p>
      <button id="signout-wrong">登出換帳號</button>
    </div>
  </div>

  <div id="content" hidden>
    <div class="meta">
      <span>登入身分：<strong id="who"></strong></span>
      <span class="month-summary" id="month-summary"></span>
      <button id="signout">登出</button>
    </div>

    <div id="overview">
      <div class="tab-bar">
        <button class="tab-btn active" id="tab-students">學生觀察</button>
        <button class="tab-btn" id="tab-courses">課程紀錄</button>
      </div>

      <!-- 分頁一：學生觀察（預設） -->
      <div id="pane-students">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.6rem;margin-top:.6rem">
          <div class="filter-row" style="margin-top:0"><label><input type="checkbox" id="filter-todo"> 只看本月還沒記的</label></div>
          <button class="add-btn" id="open-class-obs" style="background:#5a6b8c">📋 全班觀察紀錄</button>
        </div>
        <div id="student-grid" class="student-grid"><div class="empty-state">載入中…</div></div>
      </div>

      <!-- 分頁二：課程紀錄（首次點入才載入） -->
      <div id="pane-courses" hidden>
        <div class="courses-toolbar">
          <button class="add-btn" id="add-course-btn">＋ 新增課程</button>
        </div>
        <div id="new-course-form" hidden>
          <p class="nc-hint">「課程」是你想分開記的一門課或一段教學（如某一塊主課程、某一門科任課）。
            只有課程名稱是必填，其餘留空就好——留空的欄位不會顯示。</p>
          <input id="nc-title" type="text" placeholder="課程名稱（必填），例如：分數、地方探究、音樂">
          <div class="nc-row">
            <select id="nc-kind">
              <option value="main">主課程／教學區塊</option>
              <option value="subject">科任／各科</option>
            </select>
            <input id="nc-season" type="text" placeholder="學季（選填）如 秋">
          </div>
          <div class="nc-row">
            <input id="nc-weeks" type="text" placeholder="週次（選填）如 秋1–3">
            <input id="nc-teacher" type="text" placeholder="授課老師（選填）">
          </div>
          <div class="editbtns"><button id="nc-save" class="save">建立</button><button id="nc-cancel" class="cancel">取消</button><span id="nc-msg" class="msg"></span></div>
        </div>
        <div id="course-sections"><div class="empty-state">載入中…</div></div>
      </div>
    </div>

    <div id="detail" hidden>
      <div class="detail-head">
        <button class="back-link" id="back">← 回全班</button>
        <h2 id="detail-name"></h2>
        <button class="add-btn" id="add-record">＋ 新增一則紀錄</button>
      </div>
      <div id="add-form" hidden>
        <div class="add-row">
          <input id="add-date" type="date">
          <input id="add-tags" class="tags" type="text" placeholder="點下方分類，或自己打 #標籤">
        </div>
        <div id="tag-chips" class="tag-chips"></div>
        <textarea id="add-body" rows="6" placeholder="觀察內容（客觀描述具體事件；請用代號、勿寫真名）…"></textarea>
        <div class="editbtns"><button id="add-save" class="save">新增</button><button id="add-cancel" class="cancel">取消</button><span id="add-msg" class="msg"></span></div>
      </div>
      <div id="record-list"><div class="empty-state">載入中…</div></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, getDocs, query, orderBy, limit, getCountFromServer, updateDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { firebaseConfig, OWNER_EMAIL } from "./js/firebase-config.js";

const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
const authBox = $('auth'), authInitial = $('auth-initial'), authWrong = $('auth-wrong'), wrongEmail = $('wrong-email');
const content = $('content'), whoEl = $('who'), gridEl = $('student-grid'), overviewEl = $('overview'),
  detailEl = $('detail'), recordListEl = $('record-list'), detailNameEl = $('detail-name'),
  monthSummaryEl = $('month-summary'), filterTodo = $('filter-todo');

// ── 單租戶 Firestore 路徑（全部在頂層，只有擁有者能讀寫）──
const rosterRef = () => doc(db, 'roster', 'main');
const studentsCol = () => collection(db, 'students');
const recordsCol = (id) => collection(db, 'students', id, 'records');
const recordRef = (id, rid) => doc(db, 'students', id, 'records', rid);
const classObsCol = () => collection(db, 'class-observations');
const classObsRef = (rid) => doc(db, 'class-observations', rid);
// 課程（主課程／科任）。單租戶下 owner 就是唯一寫入者，所以課程卡直接從網頁建，
// 不必為了建一門課去裝 gcloud 或跑腳本——「純網頁模式就夠用」是這套的前提。
const coursesCol = () => collection(db, 'courses');
const courseRef = (cid) => doc(db, 'courses', cid);
const courseRecordsCol = (cid) => collection(db, 'courses', cid, 'records');
const courseRecordRef = (cid, rid) => doc(db, 'courses', cid, 'records', rid);

// ── 登入防呆：popup 失敗自動 redirect；App 內建瀏覽器導引到 Safari/Chrome ──
const authHelp = $('auth-help');
function authMsg(t) { if (authHelp) authHelp.innerHTML = `<span style="color:#b4654a">${esc(t)}</span>`; }
function inAppBrowser() {
  const ua = navigator.userAgent || '';
  if (/\bLine\//i.test(ua)) return 'line';
  if (/FBAN|FBAV|FB_IAB/i.test(ua)) return 'fb';
  if (/Instagram/i.test(ua)) return 'ig';
  if (/MicroMessenger/i.test(ua)) return 'wechat';
  return null;
}
function externalBrowserUrl() {
  try { const u = new URL(location.href); u.searchParams.set('openExternalBrowser', '1'); return u.toString(); }
  catch (_) { return location.href; }
}
const cleanUrl = () => location.origin + location.pathname;
function showStorageHelp() {
  if (!authHelp) return;
  authHelp.innerHTML =
    `<div style="color:#8a5a3a;background:#fdf3e7;border:1px solid #eed9bd;border-radius:8px;padding:.7rem;text-align:left">
       此瀏覽器（多半是 App 內建瀏覽器，如 LINE）無法完成 Google 登入。<br>
       請改用 <strong>Safari 或 Chrome</strong> 開啟本頁再登入：<br>
       <code style="word-break:break-all">${esc(cleanUrl())}</code><br>
       <button id="auth-copy" style="margin-top:.5rem;padding:.4rem .8rem;font:inherit;cursor:pointer">複製網址</button>
     </div>`;
  const cp = $('auth-copy');
  if (cp) cp.onclick = async () => { try { await navigator.clipboard.writeText(cleanUrl()); cp.textContent = '已複製 ✓'; } catch (_) { cp.textContent = '請手動複製上方網址'; } };
}
async function googleSignIn() {
  const p = new GoogleAuthProvider(); p.addScope('email'); p.setCustomParameters({ prompt: 'select_account' });
  try { await signInWithPopup(auth, p); }
  catch (e) {
    console.error(e);
    const code = (e && e.code) || '', msg = (e && e.message) || String(e);
    if (/web-storage-unsupported/i.test(code) || /save initial state|sessionStorage/i.test(msg)) { showStorageHelp(); return; }
    if (/popup|operation-not-supported|internal-error|cancelled/i.test(code)) {
      try { await signInWithRedirect(auth, p); return; }
      catch (e2) {
        const m2 = (e2 && e2.message) || String(e2);
        if (/save initial state|web-storage|sessionStorage/i.test(m2)) showStorageHelp();
        else authMsg('登入失敗：' + m2);
        return;
      }
    }
    if (/network-request-failed/i.test(code)) { authMsg('網路連線不穩，請確認網路後再試一次。'); return; }
    authMsg('登入失敗：' + msg);
  }
}
$('signin').onclick = () => googleSignIn();
// 內建瀏覽器：進站就提示（LINE 給一鍵跳外部；FB/IG/WeChat 給指引）
(function initAuthHelp() {
  const iab = inAppBrowser();
  if (!authHelp || !iab) return;
  if (iab === 'line') {
    authHelp.innerHTML = `<div style="color:#8a5a3a;background:#fdf3e7;border:1px solid #eed9bd;border-radius:8px;padding:.7rem;text-align:left">您在 <strong>LINE 內建瀏覽器</strong>中，Google 登入常被擋。<br><button id="auth-ext" style="margin-top:.5rem;padding:.4rem .8rem;font:inherit;cursor:pointer">改用外部瀏覽器開啟本頁</button></div>`;
    const eb = $('auth-ext'); if (eb) eb.onclick = () => { location.href = externalBrowserUrl(); };
  } else {
    const name = { fb: 'Facebook', ig: 'Instagram', wechat: 'WeChat' }[iab] || 'App';
    authHelp.innerHTML = `<div style="color:#8a5a3a;background:#fdf3e7;border:1px solid #eed9bd;border-radius:8px;padding:.7rem;text-align:left">您在 <strong>${name} 內建瀏覽器</strong>中，Google 登入常被擋。請點右上角選單 →「以外部瀏覽器開啟」，再登入。</div>`;
  }
})();
// 整頁轉址登入回來時完成（行動裝置 / 部分瀏覽器）
getRedirectResult(auth).catch(e => {
  const m = (e && e.message) || String(e);
  if (/save initial state|web-storage|sessionStorage/i.test(m)) showStorageHelp(); else console.error(e);
});
$('signout').onclick = () => signOut(auth);
$('signout-wrong').onclick = () => signOut(auth);
$('back').onclick = () => showOverview(activeCtx && activeCtx.tab);
filterTodo.onchange = renderGrid;

let activeCtx = null;   // 目前開啟的紀錄來源：{ sid, title, listCol:()=>Col, refFor:(rid)=>DocRef }
const existingRids = new Set();

// ── 一天可以記很多則 ──
// 紀錄 id：當天第一則就是日期本身（`2026-09-10`，與舊資料完全相容）；
// 之後每一則帶建立時間（`2026-09-10-1435`，同分鐘再撞就補到秒 `-143512`）。
// 身分由「日期＋時間」決定，所以在檔案中間插入一則不會讓其他則改名——
// 用流水號（-2、-3）會，那會讓同步腳本把舊副本當新紀錄再建一次，而規則不准刪。
const pad2 = n => String(n).padStart(2, '0');
function hhmm(d) { return pad2(d.getHours()) + pad2(d.getMinutes()); }
function hhmmss(d) { return hhmm(d) + pad2(d.getSeconds()); }

// 送出失敗重試時要沿用同一個 id，否則「其實寫成功了、只是回應掉了」的那種重送
// 會生出一則永久刪不掉的重複。日期改掉就重配。
let pendingRid = null, pendingRidDate = null;
async function allocRid(date) {
  if (pendingRid && pendingRidDate === date) return pendingRid;
  const now = new Date();
  // ⚠️ 一定要實查 Firestore——只看本地清單，會在「頁面停留很久／兩個分頁同時開著」時
  // 把別處剛寫的那則整篇蓋掉。
  for (const rid of [date, `${date}-${hhmm(now)}`, `${date}-${hhmmss(now)}`]) {
    const snap = await getDoc(activeCtx.refFor(rid));
    if (!snap.exists()) { pendingRid = rid; pendingRidDate = date; return rid; }
  }
  pendingRid = `${date}-${hhmmss(now)}`; pendingRidDate = date;   // 同一秒重送＝同一則，覆寫自己
  return pendingRid;
}
const addForm = $('add-form'), addBtn = $('add-record'), addDate = $('add-date'), addTags = $('add-tags'), addBody = $('add-body'), addMsg = $('add-msg');
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function thisYearMonth() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
// 標籤正規化：去掉開頭多餘的 #（避免 ##重複）、統一單一 #、去重
function normalizeTags(str) {
  const seen = new Set(), out = [];
  (str || '').split(/[\s,]+/).forEach(raw => {
    const t = raw.replace(/^#+/, '').trim();
    if (!t) return;
    const tag = '#' + t;
    if (!seen.has(tag)) { seen.add(tag); out.push(tag); }
  });
  return out;
}
function closeAddForm() {
  addForm.hidden = true; addBtn.hidden = false; addMsg.textContent = '';
  pendingRid = pendingRidDate = null;   // 取消／關閉＝這一則不寫了，配過的 id 作廢
}
addBtn.onclick = () => { addDate.value = todayStr(); addTags.value = ''; addBody.value = ''; addMsg.textContent = ''; addForm.hidden = false; addBtn.hidden = true; renderChips(); addBody.focus(); };
$('add-cancel').onclick = closeAddForm;
$('open-class-obs').onclick = () => showClassObs();

// 題材分類快速鍵（起手式清單——請改成適合你科目/年段的分類）
const CATEGORIES = ['#課堂','#學習態度','#人際','#情緒','#專注意志','#語文','#數學','#藝術','#體能','#生活自理'];
const tagChipsEl = $('tag-chips');
function currentTagSet() { return new Set(normalizeTags(addTags.value)); }
function renderChips() {
  if (!tagChipsEl) return;
  const on = currentTagSet();
  tagChipsEl.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = cat;
    if (on.has(cat)) b.classList.add('on');
    b.onclick = () => {
      const set = currentTagSet();
      set.has(cat) ? set.delete(cat) : set.add(cat);
      addTags.value = [...set].join(' ');
      renderChips();
    };
    tagChipsEl.appendChild(b);
  });
}
addTags.addEventListener('input', renderChips);

$('add-save').onclick = async (e) => {
  const btn = e.currentTarget;
  if (!activeCtx) return;
  const date = (addDate.value || '').trim(), body = addBody.value.trim();
  const tags = normalizeTags(addTags.value);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { addMsg.textContent = '請選日期'; return; }
  if (!body) { addMsg.textContent = '內容不能空白'; return; }
  btn.disabled = true; addMsg.textContent = '新增中…';
  try {
    const rid = await allocRid(date);
    await setDoc(activeCtx.refFor(rid),
      { date, tags, body, editedOnWeb: true, webEditedAt: serverTimestamp() });
    existingRids.add(rid);
    const empty = recordListEl.querySelector('.empty-state'); if (empty) recordListEl.innerHTML = '';
    recordListEl.insertBefore(renderRecordCard(rid, { date, tags, body, editedOnWeb: true }), recordListEl.firstChild);
    if (activeCtx.bump) activeCtx.bump(date);   // 回上一層時計數／徽章就是新的
    pendingRid = pendingRidDate = null;
    btn.disabled = false; closeAddForm();
  } catch (err) {
    console.error(err);
    // 前端會先更新（靜態檔一 pull 就生效），規則要人工重新部署——中間那段時間，
    // 同一天的第二則會被舊規則擋掉。與其把 Firebase 原文丟給老師，不如直接講怎麼修。
    const denied = /permission-denied|insufficient permissions/i
      .test(`${err?.code || ''} ${err?.message || ''}`);
    addMsg.textContent = (denied && pendingRid && pendingRid !== date)
      ? '新增失敗：你的安全規則還是舊版（一天只允許一則）。請重新部署 firestore.rules 後再試一次。'
      : '新增失敗：' + (err?.message || err);
    btn.disabled = false;
  }
};

// 網頁新增成功後就地把計數加一並重繪（只求即時、不求權威——重新整理時會重算）。
function bumpItem(list, key, date, rerender) {
  const it = list.find(x => x.id === key);
  if (!it) return;
  it.recordCount += 1;
  if (!it.lastRecordDate || date > it.lastRecordDate) it.lastRecordDate = date;
  rerender();
}

// ══ 分頁：學生觀察／課程紀錄 ══════════════════════════════════════════
const tabStudentsBtn = $('tab-students'), tabCoursesBtn = $('tab-courses'),
  paneStudentsEl = $('pane-students'), paneCoursesEl = $('pane-courses'),
  courseSectionsEl = $('course-sections'), addCourseBtn = $('add-course-btn'),
  newCourseForm = $('new-course-form'), ncMsg = $('nc-msg');

function setTab(tab) {
  const isCourses = tab === 'courses';
  tabStudentsBtn.classList.toggle('active', !isCourses);
  tabCoursesBtn.classList.toggle('active', isCourses);
  paneStudentsEl.hidden = isCourses;
  paneCoursesEl.hidden = !isCourses;
  if (isCourses && !coursesLoaded) loadCourses();
}
tabStudentsBtn.onclick = () => setTab('students');
tabCoursesBtn.onclick = () => setTab('courses');

// ══ 課程 ═════════════════════════════════════════════════════════════
// 課程是「你想分開記的一門課或一段教學」。學季（season）完全是選填——
// 這個 kit 給任何學制、任何科目的老師用，不預設四季主課程那套。
// 有人填了季節就按季節分組顯示，沒人填就是一份平鋪清單。
let courses = [], coursesLoaded = false;

function courseSort(a, b) {
  return (a.order || 0) - (b.order || 0) || (a.title || a.id).localeCompare(b.title || b.id);
}

async function loadCourses() {
  courseSectionsEl.innerHTML = '<div class="empty-state">載入中…</div>';
  try {
    const snap = await getDocs(coursesCol());
    const list = [];
    snap.forEach(d => list.push({ id: d.id, ...d.data() }));
    const derived = await Promise.all(list.map(c => deriveCounts(courseRecordsCol(c.id))));
    list.forEach((c, i) => { c.recordCount = derived[i].recordCount; c.lastRecordDate = derived[i].lastRecordDate; });
    courses = list; coursesLoaded = true;
    renderCourses();
  } catch (err) {
    console.error(err);
    // 網頁是靜態檔、一更新就生效；規則要人工重新部署。中間那段時間 courses 會落在
    // 「其餘全部禁止」那條底下 → 與其丟 Firebase 原文，不如直接講怎麼修。
    const denied = /permission-denied|insufficient permissions/i
      .test(`${err?.code || ''} ${err?.message || ''}`);
    courseSectionsEl.innerHTML = denied
      ? '<div class="empty-state">讀不到課程——你的安全規則還沒有 <code>courses</code> 區塊。<br>請把最新的 <code>firestore.rules</code> 重新部署一次，再重新整理本頁。</div>'
      : `<div class="empty-state">載入失敗：${esc(err.message || String(err))}</div>`;
    // coursesLoaded 保持 false → 下次切回本分頁自動重試
  }
}

function renderCourses() {
  courseSectionsEl.innerHTML = '';
  if (!courses.length) {
    courseSectionsEl.innerHTML = '<div class="empty-state">還沒有課程——點上方「＋ 新增課程」建第一門。</div>';
    return;
  }
  const groups = [['main', '【主課程／教學區塊】'], ['subject', '【科任／各科】']];
  const others = courses.filter(c => c.kind !== 'main' && c.kind !== 'subject');
  groups.forEach(([kind, label]) => {
    const inKind = courses.filter(c => c.kind === kind);
    if (!inKind.length) return;
    appendHead('section-head', label);
    // 季節是選填：這一類底下有人填了才分組，沒有就直接平鋪
    const seasons = [...new Set(inKind.map(c => c.season).filter(Boolean))];
    if (!seasons.length) { appendGrid(inKind.slice().sort(courseSort)); return; }
    seasons.sort((a, b) => {
      const ia = Math.min(...inKind.filter(c => c.season === a).map(c => c.order || 0));
      const ib = Math.min(...inKind.filter(c => c.season === b).map(c => c.order || 0));
      return ia - ib || a.localeCompare(b);
    });
    seasons.forEach(se => {
      appendHead('season-head', se);
      appendGrid(inKind.filter(c => c.season === se).sort(courseSort));
    });
    const noSeason = inKind.filter(c => !c.season).sort(courseSort);
    if (noSeason.length) { appendHead('season-head', '（未指定學季）'); appendGrid(noSeason); }
  });
  if (others.length) { appendHead('section-head', '【其他】'); appendGrid(others.slice().sort(courseSort)); }
}
function appendHead(cls, text) {
  const h = document.createElement('h3'); h.className = cls; h.textContent = text;
  courseSectionsEl.appendChild(h);
}
function appendGrid(list) {
  const grid = document.createElement('div'); grid.className = 'student-grid';
  list.forEach(c => grid.appendChild(renderCourseCard(c)));
  courseSectionsEl.appendChild(grid);
}
function renderCourseCard(c) {
  const card = document.createElement('button');
  card.className = 'student-card course-card';
  const chips = [c.season, c.weeks, c.teacherName].filter(Boolean)
    .map(x => `<span class="chip">${esc(x)}</span>`).join('');
  card.innerHTML = `<div class="sc-name">${esc(c.title || c.id)}</div>
    ${chips ? `<div class="cc-chips">${chips}</div>` : ''}
    <div class="sc-meta">${c.recordCount || 0} 則 · ${c.lastRecordDate ? '最後 ' + esc(c.lastRecordDate) : '尚無紀錄'}</div>`;
  card.onclick = () => showCourse(c);
  return card;
}

// 建立課程：id 由「學季-課名」（沒學季就課名）組出來，人看得懂、也不必另外記一組編號。
function courseIdFor(title, season) {
  return `${season ? season + '-' : ''}${title}`.replace(/[\/\.\x00-\x1f]/g, '-').trim().slice(0, 200);
}
addCourseBtn.onclick = () => {
  newCourseForm.hidden = false; addCourseBtn.hidden = true;
  ncMsg.textContent = ''; $('nc-title').focus();
};
$('nc-cancel').onclick = () => { newCourseForm.hidden = true; addCourseBtn.hidden = false; ncMsg.textContent = ''; };
$('nc-save').onclick = async (e) => {
  const btn = e.currentTarget;
  const title = $('nc-title').value.trim();
  if (!title) { ncMsg.textContent = '請填課程名稱'; return; }
  const season = $('nc-season').value.trim();
  const cid = courseIdFor(title, season);
  if (!cid) { ncMsg.textContent = '課程名稱不能只有符號'; return; }
  if (courses.some(c => c.id === cid)) { ncMsg.textContent = `已經有一門「${cid}」了`; return; }
  const data = {
    title, kind: $('nc-kind').value, season,
    weeks: $('nc-weeks').value.trim(), teacherName: $('nc-teacher').value.trim(),
    order: courses.length + 1,
  };
  btn.disabled = true; ncMsg.textContent = '建立中…';
  try {
    const existing = await getDoc(courseRef(cid));
    if (existing.exists()) { ncMsg.textContent = `已經有一門「${cid}」了`; btn.disabled = false; return; }
    await setDoc(courseRef(cid), data);
    courses.push({ id: cid, ...data, recordCount: 0, lastRecordDate: '' });
    renderCourses();
    ['nc-title', 'nc-season', 'nc-weeks', 'nc-teacher'].forEach(k => { $(k).value = ''; });
    newCourseForm.hidden = true; addCourseBtn.hidden = false; ncMsg.textContent = '';
  } catch (err) {
    console.error(err);
    const denied = /permission-denied|insufficient permissions/i
      .test(`${err?.code || ''} ${err?.message || ''}`);
    ncMsg.textContent = denied
      ? '建立失敗：安全規則還沒有 courses 區塊，請重新部署 firestore.rules。'
      : '建立失敗：' + (err?.message || err);
  }
  btn.disabled = false;
};

function showCourse(c) {
  openRecords({
    title: c.title || c.id,
    backLabel: '← 回課程列表',
    placeholder: '課程紀錄（進行到哪、教學內容、學生整體反應、下次調整；提及個別學生請用代號）…',
    listCol: () => courseRecordsCol(c.id),
    refFor: (rid) => courseRecordRef(c.id, rid),
    bump: (date) => bumpItem(courses, c.id, date, renderCourses),
  });
}

function ownerEmail(u) { return u?.email || u?.providerData?.find(p => p.providerId==='google.com')?.email || null; }

let students = [];

onAuthStateChanged(auth, async (user) => {
  if (!user) { authBox.hidden = false; authInitial.hidden = false; authWrong.hidden = true; content.hidden = true; return; }
  const email = ownerEmail(user);
  if (email !== OWNER_EMAIL) { authBox.hidden = false; authInitial.hidden = true; authWrong.hidden = false; wrongEmail.textContent = email || '(no email)'; content.hidden = true; return; }
  authBox.hidden = true; content.hidden = false; whoEl.textContent = email; await loadOverview();
});

// ── 計數／最後日期：讀取時即時衍生，不看 students/{id} 上的摘要欄位 ──
// 那三個欄位（recordCount / lastRecordDate / monthsRecorded）只有進階腳本 sync.py 會寫。
// 純網頁模式（README 與說明書都說「多數人夠用」的那個模式）下沒有任何東西會更新它們，
// 於是記了一整個月，每張卡片還是「0 則 · 尚無紀錄 · 本月未記」——全班一覽整片是死的。
// 改成每位學生發 1 次 count 聚合 ＋ 1 筆 limit(1)：不必改規則、不必跑腳本、不新增寫入者。
// （摘要欄位保留不動，sync.py 仍可寫，只是儀表板不再依賴它。）
async function deriveCounts(col) {
  const [recordCount, lastRecordDate] = await Promise.all([
    getCountFromServer(col).then(s => s.data().count).catch(e => { console.error(e); return 0; }),
    getDocs(query(col, orderBy('date', 'desc'), limit(1)))
      .then(s => s.empty ? '' : (s.docs[0].data().date || ''))
      .catch(e => { console.error(e); return ''; }),
  ]);
  return { recordCount, lastRecordDate };
}
// 「本月已記」＝最後一則落在本月一號之後。日期填成未來月份時會提早變綠，
// 那是罕見誤填，不值得為它每位學生多打一次查詢。
function recordedThisMonth(lastRecordDate) {
  return !!lastRecordDate && lastRecordDate >= thisYearMonth() + '-01';
}

async function loadOverview() {
  gridEl.innerHTML = '<div class="empty-state">載入中…</div>';
  try {
    const rosterSnap = await getDoc(rosterRef());
    const nameById = {};
    if (rosterSnap.exists()) (rosterSnap.data().students || []).forEach(s => { nameById[s.id] = s.name; });
    const studentsSnap = await getDocs(studentsCol());
    const idSet = new Set(Object.keys(nameById));
    studentsSnap.forEach(d => idSet.add(d.id));   // 名冊沒有、但已有紀錄的代號也要列出
    const ids = [...idSet].sort();
    const derived = await Promise.all(ids.map(id => deriveCounts(recordsCol(id))));
    students = ids.map((id, i) => ({
      id, name: nameById[id] || id,
      recordCount: derived[i].recordCount,
      lastRecordDate: derived[i].lastRecordDate,
    }));
    renderGrid();
  } catch (err) { console.error(err); gridEl.innerHTML = `<div class="empty-state">載入失敗：${esc(err.message||String(err))}</div>`; }
}

function renderGrid() {
  const ym = thisYearMonth();
  const done = students.filter(s => recordedThisMonth(s.lastRecordDate)).length;
  monthSummaryEl.innerHTML = `本月（${ym}）已記 <strong>${done}</strong> ／ ${students.length}`;
  const list = students.filter(s => !filterTodo.checked || !recordedThisMonth(s.lastRecordDate));
  if (!list.length) { gridEl.innerHTML = '<div class="empty-state">' + (filterTodo.checked ? '本月都記過了 🎉' : '尚無學生資料。') + '</div>'; return; }
  gridEl.innerHTML = '';
  list.forEach(s => {
    const isDone = recordedThisMonth(s.lastRecordDate);
    const card = document.createElement('button');
    card.className = 'student-card' + (isDone ? '' : ' is-todo');
    card.innerHTML = `<div><span class="sc-name">${esc(s.name)}</span><span class="sc-id">${esc(s.id)}</span></div>
      <div class="sc-meta">${s.recordCount} 則 · ${s.lastRecordDate ? '最後 ' + esc(s.lastRecordDate) : '尚無紀錄'}</div>
      <span class="badge ${isDone?'done':'todo'}">${isDone?'本月已記':'本月未記'}</span>`;
    card.onclick = () => showDetail(s);
    gridEl.appendChild(card);
  });
}

function showDetail(s) {
  openRecords({
    tab: 'students',
    title: `${s.name}（${s.id}）`,
    listCol: () => recordsCol(s.id),
    refFor: (rid) => recordRef(s.id, rid),
    bump: (date) => bumpItem(students, s.id, date, renderGrid),
  });
}
function showClassObs() {
  openRecords({
    tab: 'students',
    title: '全班觀察紀錄',
    placeholder: '整班觀察（班級氛圍、節奏、群體動力、課程進行狀況；提及個別學生請用代號）…',
    listCol: () => classObsCol(),
    refFor: (rid) => classObsRef(rid),
  });   // 全班觀察在總覽上沒有卡片，不用 bump
}
async function openRecords(ctx) {
  activeCtx = ctx;
  overviewEl.hidden = true; detailEl.hidden = false;
  detailNameEl.textContent = ctx.title;
  $('back').textContent = ctx.backLabel || '← 回全班';
  addBody.placeholder = ctx.placeholder || '觀察內容（客觀描述具體事件；請用代號、勿寫真名）…';
  closeAddForm(); existingRids.clear();
  recordListEl.innerHTML = '<div class="empty-state">載入中…</div>';
  try {
    const snap = await getDocs(query(ctx.listCol(), orderBy('date','desc')));
    recordListEl.innerHTML = '';
    if (snap.empty) { recordListEl.innerHTML = '<div class="empty-state">還沒有紀錄——點上方「＋ 新增一則紀錄」開始。</div>'; }
    else snap.forEach(d => { existingRids.add(d.id); recordListEl.appendChild(renderRecordCard(d.id, d.data())); });
  } catch (err) { console.error(err); recordListEl.innerHTML = `<div class="empty-state">載入失敗：${esc(err.message||String(err))}</div>`; }
}

// 同一天多則時，第二則之後的 id 帶建立時間（`…-1435`）——把它顯示出來，
// 否則畫面上會出現兩個一模一樣的日期，分不出誰是誰。
function ridTimeLabel(rid, date) {
  if (!rid || !date || !rid.startsWith(date + '-')) return '';
  const suf = rid.slice(date.length + 1);
  if (/^\d{4}$/.test(suf)) return ` ${suf.slice(0,2)}:${suf.slice(2)}`;
  if (/^\d{6}$/.test(suf)) return ` ${suf.slice(0,2)}:${suf.slice(2,4)}:${suf.slice(4)}`;
  return '';
}

function renderRecordCard(rid, r) {
  const card = document.createElement('div'); card.className = 'record-card';
  const tags = (r.tags||[]).map(t => `<span class="record-tag">${esc(t)}</span>`).join('');
  const flag = r.editedOnWeb ? '<em>（已編輯，待同步）</em>' : '';
  card.innerHTML = `<div class="record-head"><span><span class="rc-date">${esc((r.date||'') + ridTimeLabel(rid, r.date))}</span> ${tags} <span class="flag">${flag}</span></span><button class="rc-edit">編輯</button></div>
    <p class="record-body">${esc(r.body||'')}</p>
    <div class="editor" hidden>
      <input class="tags" type="text" value="${esc((r.tags||[]).join(' '))}" placeholder="#tag">
      <textarea class="body-edit" rows="6">${esc(r.body||'')}</textarea>
      <div class="editbtns"><button class="save">儲存</button><button class="cancel">取消</button><span class="msg"></span></div>
    </div>`;
  const bodyEl = card.querySelector('.record-body'), editorEl = card.querySelector('.editor'), editBtn = card.querySelector('.rc-edit'), msg = card.querySelector('.msg');
  editBtn.onclick = () => { bodyEl.hidden = true; editorEl.hidden = false; editBtn.hidden = true; };
  card.querySelector('.cancel').onclick = () => { bodyEl.hidden = false; editorEl.hidden = true; editBtn.hidden = false; };
  card.querySelector('.save').onclick = async (e) => {
    const btn = e.currentTarget; btn.disabled = true; msg.textContent = '儲存中…';
    const nb = card.querySelector('.body-edit').value.trim();
    const nt = normalizeTags(card.querySelector('.editor .tags').value);
    try {
      await updateDoc(activeCtx.refFor(rid), { body: nb, tags: nt, editedOnWeb: true, webEditedAt: serverTimestamp() });
      bodyEl.textContent = nb; card.querySelector('.flag').innerHTML = '<em>（已編輯，待同步）</em>';
      bodyEl.hidden = false; editorEl.hidden = true; editBtn.hidden = false; msg.textContent = '';
    } catch (err) { console.error(err); msg.textContent = '儲存失敗：' + (err?.message||err); btn.disabled = false; }
  };
  return card;
}

function showOverview(tab) {
  detailEl.hidden = true; overviewEl.hidden = false;
  setTab(tab || 'students');
}
function esc(s) { return (s ?? '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
</script>
</body>
